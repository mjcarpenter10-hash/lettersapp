<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Letter Sounds</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Letter Sounds">
<meta name="theme-color" content="#FFF5FA">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FFF5FA'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' font-family='sans-serif' font-weight='700' fill='%235E2A72'%3EAa%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --blush:#FFF5FA;
    --petal:#FF8FBE;
    --petal-deep:#E4407F;
    --grape:#7B3FA8;
    --lilac:#D9BDF2;
    --ink:#5E2A72;
    --sun:#FFE9A8;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{
    background:
      radial-gradient(120% 80% at 50% 0%, #FFEAF4 0%, rgba(255,234,244,0) 60%),
      radial-gradient(100% 70% at 50% 100%, #F3E6FF 0%, rgba(243,230,255,0) 55%),
      var(--blush);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Avenir Next", system-ui, sans-serif;
    color:var(--ink);
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  .app{
    height:100dvh; height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:max(14px, env(safe-area-inset-top)) 20px max(18px, env(safe-area-inset-bottom));
    gap:14px;
  }
  .tabs{
    display:flex; gap:8px; align-items:center; justify-content:center;
    flex-wrap:wrap; width:100%; max-width:440px; padding:2px 0;
  }
  .tab{
    font:inherit; font-size:15px; font-weight:700; letter-spacing:.2px;
    padding:9px 20px; border-radius:999px; border:none; cursor:pointer;
    background:#FFFFFF; color:var(--grape);
    box-shadow:inset 0 0 0 2px var(--lilac);
  }
  .tab.on{
    background:linear-gradient(150deg,var(--petal),#B06BD6);
    color:#FFFFFF; box-shadow:0 8px 18px -10px rgba(123,63,168,.7);
  }
  .tab.slot{
    background:transparent; color:var(--grape); opacity:.42;
    box-shadow:inset 0 0 0 2px var(--lilac); border-style:dashed;
    cursor:default; font-weight:600;
  }
  .card{
    flex:1 1 auto; width:100%; max-width:440px; min-height:0;
    border:none; padding:0; margin:0; font:inherit; color:inherit;
    background:var(--card);
    border-radius:38px;
    box-shadow:0 18px 44px -20px rgba(123,63,168,.45), 0 0 0 6px #FFFFFF, 0 0 0 9px var(--lilac);
    display:flex; align-items:center; justify-content:center; gap:.06em;
    cursor:pointer; position:relative; overflow:hidden;
  }
  .card::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(70% 55% at 50% 12%, rgba(255,143,190,.14), rgba(255,255,255,0) 70%);
    pointer-events:none;
  }
  .glyphs{display:flex; align-items:baseline; justify-content:center; line-height:1}
  .up{font-size:clamp(90px,26vh,190px); font-weight:800; color:var(--ink)}
  .low{font-size:clamp(76px,22vh,162px); font-weight:800; color:var(--petal-deep)}
  .view{
    flex:1 1 auto; width:100%; min-height:0;
    display:none; flex-direction:column; align-items:center; gap:14px;
  }
  .view.on{display:flex}
  .card.pop .glyphs{animation:pop .5s cubic-bezier(.2,.9,.3,1)}
  @keyframes pop{
    0%{transform:scale(.78) rotate(-4deg);opacity:0}
    60%{transform:scale(1.03);opacity:1}
    100%{transform:none;opacity:1}
  }
  .card.shake{animation:shake .5s ease-out}
  @keyframes shake{
    0%{transform:scale(.985)}
    100%{transform:none}
  }
  .flash{position:absolute; inset:-10%; border-radius:50%}
  .card:active{transform:scale(.985)}

  .hint{margin:0; font-size:15px; color:var(--grape); opacity:.6; text-align:center}

  .controls{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
  .pill{
    font:inherit; font-size:14px; font-weight:700; color:var(--grape);
    padding:8px 16px; border-radius:999px; border:none; cursor:pointer;
    background:#FFFFFF; box-shadow:inset 0 0 0 2px var(--lilac);
  }
  .pill:active{transform:translateY(1px)}
  .pill.rec{background:var(--petal-deep); color:#fff; box-shadow:none;
    animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.62}}
  .pill.muted{opacity:.5}
  .badge{
    position:absolute; top:16px; right:18px; font-size:15px; opacity:0;
    color:var(--petal-deep); transition:opacity .2s;
  }
  .badge.on{opacity:.85}

  .prompt{
    margin:0; font-size:17px; font-weight:700; color:var(--grape);
    text-align:center; min-height:1.2em;
  }
  .tiles{
    flex:1 1 auto; min-height:0; width:100%;
    display:flex; gap:12px; align-items:center; justify-content:center;
  }
  .tile{
    font:inherit; border:none; cursor:pointer; padding:0;
    width:clamp(72px,23vw,132px); height:min(100%, clamp(96px,30vh,176px));
    border-radius:28px; background:var(--card); color:var(--ink);
    font-size:clamp(50px,14vw,100px); font-weight:800; line-height:1;
    display:grid; place-items:center;
    box-shadow:0 14px 30px -18px rgba(123,63,168,.5), inset 0 0 0 3px var(--lilac);
    transition:transform .18s, box-shadow .18s, color .18s;
  }
  .tile:active{transform:scale(.96)}
  .tile.sel{box-shadow:0 0 0 4px var(--petal), 0 14px 30px -18px rgba(123,63,168,.5)}
  .tile.lit{
    transform:translateY(-8px) scale(1.09); color:var(--petal-deep);
    box-shadow:0 18px 34px -16px rgba(228,64,127,.7), inset 0 0 0 3px var(--petal);
  }
  .tile.found{color:var(--petal-deep); box-shadow:0 0 0 4px var(--petal-deep), 0 14px 30px -18px rgba(123,63,168,.5)}
  .tile.has::after{
    content:"\25CF"; position:absolute; top:10px; right:12px;
    font-size:13px; color:var(--petal-deep); opacity:.8;
  }
  .tile{position:relative}
  .tile.nope{animation:wiggle .45s ease}
  @keyframes wiggle{25%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}75%{transform:rotate(-3deg)}}

  .builder{display:flex; flex-direction:column; gap:10px; align-items:center}
  .alpha{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:360px}
  .alpha button{
    font:inherit; font-size:17px; font-weight:800; color:var(--grape);
    width:38px; height:38px; border-radius:13px; border:none; cursor:pointer;
    background:#FFFFFF; box-shadow:inset 0 0 0 2px var(--lilac);
  }
  .alpha button:active{background:var(--lilac)}

  .nav{display:flex; align-items:center; justify-content:center; gap:26px; width:100%}
  .arrow{
    width:84px; height:84px; border-radius:50%; border:none;
    background:linear-gradient(160deg,#FFFFFF,#FFE7F3);
    box-shadow:0 10px 24px -12px rgba(123,63,168,.55), inset 0 0 0 3px var(--lilac);
    display:grid; place-items:center; cursor:pointer;
  }
  .arrow:active{transform:translateY(2px) scale(.96)}
  .arrow svg{width:36px;height:36px;stroke:var(--grape);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .arrow:focus-visible,.card:focus-visible{outline:4px solid var(--petal);outline-offset:4px}

  .dots{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; max-width:320px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--lilac);transition:background .2s,transform .2s}
  .dot.on{background:var(--petal-deep); transform:scale(1.7)}

  #stage{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:9}
  .fx{position:absolute; will-change:transform,opacity}
  .fx svg{width:100%;height:100%;display:block}
  .sweep{position:absolute; top:-20%; left:0; width:60%; height:140%; opacity:.85;
    filter:blur(2px); transform:skewX(-12deg)}
  .ring{position:absolute; border-radius:50%; border:6px solid var(--petal)}

  @media (prefers-reduced-motion: reduce){
    .card.pop .glyphs{animation:none}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="tabs" id="tabs" aria-label="Activities">
    <button class="tab on" data-view="letters">Letters</button>
    <button class="tab" data-view="blend">Blend</button>
    <span class="tab slot">More soon</span>
  </nav>

  <!-- Each activity is one .view section. Add another below, give it an id
       like view-numbers, and add a matching <button class="tab" data-view="numbers"> above. -->
  <section class="view on" id="view-letters">

  <button class="card" id="card" aria-live="polite">
    <span class="glyphs"><span class="up" id="up">A</span><span class="low" id="low">a</span></span>
    <span class="badge" id="badge" aria-hidden="true">&#9679;</span>
  </button>

  <div class="controls">
    <button class="pill" id="recBtn">Record her voice</button>
    <button class="pill" id="delBtn" hidden>Erase</button>
    <button class="pill" id="exportBtn" hidden>Save clips</button>
    <button class="pill" id="soundBtn">Sound on</button>
  </div>

  <p class="hint" id="hint">Tap the letter to hear her sound</p>

  <div class="nav">
    <button class="arrow" id="prev" aria-label="Previous letter">
      <svg viewBox="0 0 100 100"><path d="M62 18 L30 50 L62 82"/></svg>
    </button>
    <button class="arrow" id="next" aria-label="Next letter">
      <svg viewBox="0 0 100 100"><path d="M38 18 L70 50 L38 82"/></svg>
    </button>
  </div>

  <div class="dots" id="dots" aria-hidden="true"></div>

  </section>

  <section class="view" id="view-blend">

    <p class="prompt" id="prompt">Tap a letter to hear her sound</p>

    <div class="tiles" id="tiles"></div>

    <div class="controls">
      <button class="pill" id="blendBtn">Blend it</button>
      <button class="pill" id="askBtn">Find the sound</button>
      <button class="pill" id="buildBtn">Change letters</button>
    </div>

    <div class="builder" id="builder" hidden>
      <div class="alpha" id="alpha"></div>
      <div class="controls">
        <button class="pill" id="minusBtn">Fewer</button>
        <button class="pill" id="plusBtn">More</button>
        <button class="pill" id="keepBtn">Keep this word</button>
      </div>
    </div>

    <div class="nav">
      <button class="arrow" id="wPrev" aria-label="Previous word">
        <svg viewBox="0 0 100 100"><path d="M62 18 L30 50 L62 82"/></svg>
      </button>
      <button class="arrow" id="wNext" aria-label="Next word">
        <svg viewBox="0 0 100 100"><path d="M38 18 L70 50 L38 82"/></svg>
      </button>
    </div>

    <p class="hint" id="wHint">Arrows change the word</p>

  </section>
</div>
<div id="stage"></div>

<script>
/* ------------------------------------------------------------------
   Every sound in this app is her own voice. Nothing is spoken by the
   device. A letter with no recording yet simply stays quiet when tapped.
   Record a letter once on the Letters card and it plays everywhere,
   including the tiles in Blend, because both look it up by letter.
------------------------------------------------------------------ */

// Where her voice lives once it ships with the app. Export her recordings
// with "Save clips", unzip, and upload that sounds folder next to this file.
// Until those files exist the app just uses whatever is recorded on the
// device, so this needs no editing either way.
const AUDIO_FOLDER = 'sounds';

const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let i = 0, lastFx = -1, soundOn = true;

const card = document.getElementById('card');
const upEl = document.getElementById('up');
const lowEl = document.getElementById('low');
const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
const badge = document.getElementById('badge');
const hint = document.getElementById('hint');
const recBtn = document.getElementById('recBtn');
const delBtn = document.getElementById('delBtn');
const exportBtn = document.getElementById('exportBtn');
const soundBtn = document.getElementById('soundBtn');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

LETTERS.forEach(() => {
  const d = document.createElement('span');
  d.className = 'dot';
  dotsEl.appendChild(d);
});
const dots = [...dotsEl.children];

/* ---------------- your recorded sounds ---------------- */
/* Saved on this device only, one clip per letter. */
const mem = new Map();
let db = null, dbTried = false;

function idb(){
  return new Promise(res => {
    if (db || dbTried) return res(db);
    let rq;
    try { rq = indexedDB.open('letter-sounds', 2); }
    catch(e){ dbTried = true; return res(null); }
    rq.onupgradeneeded = () => {
      const d = rq.result;
      if (!d.objectStoreNames.contains('clips')) d.createObjectStore('clips');
      if (!d.objectStoreNames.contains('words')) d.createObjectStore('words');
    };
    rq.onsuccess = () => { db = rq.result; dbTried = true; res(db); };
    rq.onerror = rq.onblocked = () => { dbTried = true; res(null); };
  });
}
async function getClip(L){
  if (mem.has(L)) return mem.get(L);
  const d = await idb(); if (!d) return null;
  return new Promise(res => {
    try {
      const rq = d.transaction('clips','readonly').objectStore('clips').get(L);
      rq.onsuccess = () => { mem.set(L, rq.result || null); res(rq.result || null); };
      rq.onerror = () => res(null);
    } catch(e){ res(null); }
  });
}
async function putClip(L, blob){
  mem.set(L, blob);
  const d = await idb(); if (!d) return;
  try { d.transaction('clips','readwrite').objectStore('clips').put(blob, L); } catch(e){}
}
async function delClip(L){
  mem.set(L, null);
  const d = await idb(); if (!d) return;
  try { d.transaction('clips','readwrite').objectStore('clips').delete(L); } catch(e){}
}
async function clipKeys(){
  const d = await idb();
  if (!d) return [...mem].filter(([,v]) => v).map(([k]) => k);
  return new Promise(res => {
    try {
      const rq = d.transaction('clips','readonly').objectStore('clips').getAllKeys();
      rq.onsuccess = () => res(rq.result || []);
      rq.onerror = () => res([]);
    } catch(e){ res([]); }
  });
}

/* Bundle every recording into a zip you can unpack into the repo. */
const CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for (let n = 0; n < u8.length; n++) c = CRC[(c ^ u8[n]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zip(files){
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  for (const f of files){
    const name = enc.encode(f.name), size = f.data.length, crc = crc32(f.data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, size, true);
    lh.setUint32(22, size, true); lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  }
  const cSize = central.reduce((n, p) => n + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], {type:'application/zip'});
}
async function exportClips(){
  const keys = await clipKeys();
  if (!keys.length) return;
  hint.textContent = 'Packing up her recordings\u2026';
  const files = [];
  for (const L of keys){
    const blob = await getClip(L);
    if (!blob) continue;
    const ext = (blob.type || '').includes('webm') ? 'webm' : 'm4a';
    files.push({name: `sounds/${L.toLowerCase()}.${ext}`, data: new Uint8Array(await blob.arrayBuffer())});
  }
  const url = URL.createObjectURL(zip(files));
  const a = document.createElement('a');
  a.href = url; a.download = 'letter-sounds.zip';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  hint.textContent = `Saved ${files.length} clip${files.length === 1 ? '' : 's'} to your files.`;
}

const player = new Audio();
function playBlob(blob){
  const url = URL.createObjectURL(blob);
  player.src = url;
  player.onended = player.onerror = () => URL.revokeObjectURL(url);
  player.play().catch(()=>{});
}

/* Plays one letter's recording and resolves when it finishes, so Blend can
   run them back to back. Resolves false when that letter has no recording
   yet. Blend tiles call this with the same letter key the Letters card
   records under, so a clip made once plays in both places. */
const noFile = new Set();   // letters with no file in the sounds folder
function playSound(L){
  L = L.toUpperCase();
  return new Promise(async resolve => {
    if (!soundOn) return resolve(false);
    const clip = await getClip(L);
    if (clip){
      const url = URL.createObjectURL(clip);
      const a = new Audio(url);
      a.onended = a.onerror = () => { URL.revokeObjectURL(url); resolve(true); };
      a.play().catch(() => resolve(true));
      return;
    }
    if (AUDIO_FOLDER && !noFile.has(L)){
      const base = `${AUDIO_FOLDER}/${L.toLowerCase()}`;
      const a = new Audio(base + '.m4a');
      a.onended = () => resolve(true);
      a.onerror = () => {
        const b = new Audio(base + '.webm');
        b.onended = () => resolve(true);
        b.onerror = () => { noFile.add(L); resolve(false); };
        b.play().catch(() => { noFile.add(L); resolve(false); });
      };
      a.play().catch(() => a.onerror());
      return;
    }
    resolve(false);   // nothing recorded yet — stay quiet
  });
}

async function playCurrent(){
  await playSound(LETTERS[i]);
}

/* recording */
let recorder = null, chunks = [], micStream = null;
async function toggleRecord(){
  if (recorder && recorder.state === 'recording'){ recorder.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder){
    hint.textContent = 'This browser can\u2019t record. Try Safari or Chrome.';
    return;
  }
  try { micStream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ hint.textContent = 'Microphone is off. Turn it on for this site in Settings.'; return; }

  const L = LETTERS[i];
  chunks = [];
  recorder = new MediaRecorder(micStream);
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = async () => {
    micStream.getTracks().forEach(t => t.stop());
    const blob = new Blob(chunks, {type: recorder.mimeType || 'audio/mp4'});
    await putClip(L, blob);
    recorder = null;
    recBtn.classList.remove('rec');
    hint.textContent = 'That\u2019s her voice \u2014 tap the letter to hear it.';
    recorded.add(L);
    await refreshControls();
    playCurrent();
  };
  recorder.start();
  recBtn.classList.add('rec');
  recBtn.textContent = 'Stop';
  hint.textContent = 'Recording \u2014 have her say the sound, then tap Stop.';
}

async function refreshControls(){
  const L = LETTERS[i];
  const has = !!(await getClip(L));
  badge.classList.toggle('on', has);
  delBtn.hidden = !has;
  if (!recorder) recBtn.textContent = has ? 'Record again' : 'Record her voice';
  recBtn.disabled = false;
  soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
  soundBtn.classList.toggle('muted', !soundOn);
  const keys = await clipKeys();
  keys.forEach(k => recorded.add(k));
  const n = keys.length;
  exportBtn.hidden = n === 0;
  exportBtn.textContent = `Save ${n} clip${n === 1 ? '' : 's'}`;
}

/* ---------------- flower + transition effects ---------------- */
const BLUE   = {petals:['#7EC8F5','#4FA8E8','#A8DCFF','#63B8F0'], center:'#FFF0B8'};
const PINK   = {petals:['#FFAFD0','#FF7FB5','#FFD3E6','#F9639F'], center:'#FFF0B8'};
const PURPLE = {petals:['#C6A4F5','#9B6BE0','#E3D2FF','#B07FEE'], center:'#FFF0B8'};
const MULTI  = {petals:['#FF7FB5','#9B6BE0','#4FA8E8','#FFD166','#7ED99B','#FF9E6B'], center:'#FFFFFF'};
const RAINBOW = ['#FF8BA7','#FFB86B','#FFE066','#8FE388','#6FC3F5','#9B8BF5','#D98BF5'];

const rand = (a,b) => a + Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

function flower(pal, size){
  const el = document.createElement('div');
  el.className = 'fx';
  el.style.width = el.style.height = size + 'px';
  const petal = pick(pal.petals);
  let p = '';
  for (let a = 0; a < 360; a += 72){
    p += `<ellipse cx="50" cy="27" rx="17" ry="25" fill="${petal}" transform="rotate(${a} 50 50)"/>`;
  }
  el.innerHTML = `<svg viewBox="0 0 100 100">${p}<circle cx="50" cy="50" r="13" fill="${pal.center}"/></svg>`;
  stage.appendChild(el);
  return el;
}

function center(){
  const v = document.querySelector('.view.on') || card;
  const r = v.getBoundingClientRect();
  return [r.left + r.width/2, r.top + r.height/2];
}

// A soft wash of color over the whole screen — makes every effect read bigger.
function flash(color){
  const el = document.createElement('div');
  el.className = 'fx flash';
  const [cx, cy] = center();
  el.style.left = 0; el.style.top = 0;
  el.style.width = '100%'; el.style.height = '100%';
  el.style.background = `radial-gradient(circle at ${cx}px ${cy}px, ${color} 0%, rgba(255,255,255,0) 62%)`;
  stage.appendChild(el);
  el.animate([
    {opacity:0, transform:'scale(.6)'},
    {opacity:.28, transform:'scale(1)', offset:.45},
    {opacity:0, transform:'scale(1.2)'}
  ], {duration:1300, easing:'cubic-bezier(.4,0,.5,1)'}).onfinish = () => el.remove();
}

function burst(pal, tint){
  flash(tint);
  ripple(pal.petals);
  const [cx, cy] = center();
  const reach = Math.hypot(innerWidth, innerHeight) * 0.45;
  for (let n = 0; n < 22; n++){   // raise for a bigger party
    const size = rand(28, 72);
    const el = flower(pal, size);
    el.style.left = (cx - size/2) + 'px';
    el.style.top  = (cy - size/2) + 'px';
    const ang = rand(0, Math.PI*2), dist = rand(reach*0.35, reach);
    el.animate([
      {transform:'translate(0,0) scale(.3) rotate(0deg)', opacity:.9, offset:0},
      {transform:`translate(${Math.cos(ang)*dist*.55}px, ${Math.sin(ang)*dist*.55}px) scale(1) rotate(${rand(-90,90)}deg)`, opacity:.95, offset:.5},
      {transform:`translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px) scale(.55) rotate(${rand(-420,420)}deg)`, opacity:0, offset:1}
    ], {duration:rand(1200, 1700), delay:rand(0,200), easing:'cubic-bezier(.25,.7,.3,1)'}).onfinish = () => el.remove();
  }
}

function petalRain(pal, tint){
  flash(tint);
  const w = innerWidth, h = innerHeight;
  for (let n = 0; n < 24; n++){
    const size = rand(24, 62);
    const el = flower(pal, size);
    el.style.left = rand(-40, w) + 'px';
    el.style.top = -(size + rand(10, 220)) + 'px';
    el.animate([
      {transform:'translate(0,0) rotate(0deg) scale(1)', opacity:1},
      {transform:`translate(${rand(-60,60)}px, ${h*0.55}px) rotate(${rand(-200,200)}deg) scale(1.1)`, opacity:1, offset:.6},
      {transform:`translate(${rand(-140,140)}px, ${h + 200}px) rotate(${rand(-540,540)}deg) scale(.9)`, opacity:.85}
    ], {duration:rand(1400, 2100), delay:rand(0,320), easing:'cubic-bezier(.35,.15,.6,1)'}).onfinish = () => el.remove();
  }
}

function rainbowSweep(){
  flash('rgba(255,214,102,.28)');
  [0].forEach(k => {
    const el = document.createElement('div');
    el.className = 'sweep';
    el.style.width = '150%';
    el.style.background = `linear-gradient(${k ? 260 : 100}deg, ${RAINBOW.join(',')})`;
    stage.appendChild(el);
    el.animate([
      {transform:`translateX(${k ? 180 : -180}%) skewX(-14deg) scaleY(.7)`, opacity:0},
      {transform:'translateX(-12%) skewX(-14deg) scaleY(1)', opacity:.6, offset:.45},
      {transform:`translateX(${k ? -200 : 200}%) skewX(-14deg) scaleY(.8)`, opacity:0}
    ], {duration:1600, delay:k*180, easing:'cubic-bezier(.35,.6,.35,1)'}).onfinish = () => el.remove();
  });
}

function ripple(colors){
  const [cx, cy] = center();
  (colors || ['#FF8FBE','#9B6BE0','#FFD166']).slice(0,3).forEach((c, k) => {
    const el = document.createElement('div');
    el.className = 'ring';
    el.style.borderColor = c;
    el.style.borderWidth = '5px';
    el.style.left = cx + 'px'; el.style.top = cy + 'px';
    el.style.width = el.style.height = '24px';
    el.style.marginLeft = el.style.marginTop = '-12px';
    stage.appendChild(el);
    el.animate([
      {transform:'scale(.2)', opacity:.55},
      {transform:`scale(${rand(18,30)})`, opacity:0}
    ], {duration:1200, delay:k*160, easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish = () => el.remove();
  });
}

const EFFECTS = [
  () => burst(BLUE,   'rgba(111,195,245,.35)'),
  () => burst(PINK,   'rgba(255,143,190,.35)'),
  () => burst(PURPLE, 'rgba(155,107,224,.32)'),
  () => burst(MULTI,  'rgba(255,209,102,.32)'),
  () => petalRain(PINK,  'rgba(255,143,190,.28)'),
  () => petalRain(MULTI, 'rgba(199,164,245,.28)'),
  rainbowSweep
];

function playRandomEffect(){
  if (reduce) return;
  let n;
  do { n = Math.floor(Math.random()*EFFECTS.length); } while (n === lastFx && EFFECTS.length > 1);
  lastFx = n;
  EFFECTS[n]();
}

/* ---------------- card ---------------- */
function render(){
  const L = LETTERS[i];
  upEl.textContent = L;
  lowEl.textContent = L.toLowerCase();
  card.setAttribute('aria-label', L + ' ' + L.toLowerCase());
  dots.forEach((d, k) => d.classList.toggle('on', k === i));
  card.classList.remove('pop','shake');
  void card.offsetWidth;
  card.classList.add('pop');
  if (!reduce) card.classList.add('shake');
}

function move(step){
  i = (i + step + LETTERS.length) % LETTERS.length;
  render();
  refreshControls();
  playRandomEffect();
}

card.addEventListener('click', playCurrent);
document.getElementById('next').addEventListener('click', () => move(1));
document.getElementById('prev').addEventListener('click', () => move(-1));
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'ArrowLeft') move(-1);
  else if (e.key === ' ' || e.key === 'Enter') playCurrent();
});

recBtn.addEventListener('click', toggleRecord);
exportBtn.addEventListener('click', exportClips);
delBtn.addEventListener('click', async () => {
  await delClip(LETTERS[i]);
  recorded.delete(LETTERS[i]);
  hint.textContent = 'Erased.';
  refreshControls();
});
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  hint.textContent = soundOn
    ? 'Tap the letter to hear her sound'
    : 'Quiet mode \u2014 you make the sound together';
  refreshControls();
});

// swipe
let x0 = null, y0 = null;
addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  const dy = e.changedTouches[0].clientY - y0;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) move(dx < 0 ? 1 : -1);
  x0 = y0 = null;
}, {passive:true});

// Activity tabs. A new tab needs only a matching .view section with id view-<name>.
document.querySelectorAll('.tab[data-view]').forEach(t => {
  t.addEventListener('click', () => {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    target = null; found = []; exitBuild();
    document.querySelectorAll('.tab[data-view]').forEach(x => x.classList.toggle('on', x === t));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + t.dataset.view));
  });
});

/* ================= BLEND ================= */
/* A word is just an ordered list of letters. Each tile looks its sound up
   by letter, so it plays the exact clip recorded on the Letters card. */

const DEFAULT_WORDS = [
  'at','it','in','up',
  'cat','bat','hat','mat','sat',
  'pan','man','fan','can',
  'pig','big','dig','wig',
  'hot','pot','dot','top',
  'sun','fun','run','bug','rug',
  'bed','red','net','pet'
];

const tilesEl = document.getElementById('tiles');
const promptEl = document.getElementById('prompt');
const wHint = document.getElementById('wHint');
const alphaEl = document.getElementById('alpha');
const builder = document.getElementById('builder');
const blendBtn = document.getElementById('blendBtn');
const askBtn = document.getElementById('askBtn');
const buildBtn = document.getElementById('buildBtn');

const recorded = new Set();   // letters that have her voice on them
async function refreshRecorded(){
  (await clipKeys()).forEach(k => recorded.add(k));
  if (!builder.hidden || document.getElementById('view-blend').classList.contains('on')) drawTiles();
}

let words = DEFAULT_WORDS.slice();
let w = 0;
let letters = words[0].split('');
let selSlot = null, target = null, found = [], busy = false, building = false;

async function loadWords(){
  const d = await idb(); if (!d) return;
  await new Promise(res => {
    try {
      const rq = d.transaction('words','readonly').objectStore('words').get('list');
      rq.onsuccess = () => { if (Array.isArray(rq.result) && rq.result.length) words = rq.result; res(); };
      rq.onerror = () => res();
    } catch(e){ res(); }
  });
  letters = words[Math.min(w, words.length-1)].split('');
  drawTiles();
}
async function saveWords(){
  const d = await idb(); if (!d) return;
  try { d.transaction('words','readwrite').objectStore('words').put(words.slice(), 'list'); } catch(e){}
}

function drawTiles(){
  tilesEl.innerHTML = '';
  letters.forEach((ch, n) => {
    const b = document.createElement('button');
    b.className = 'tile';
    b.textContent = ch;
    b.dataset.slot = n;
    if (recorded.has(ch.toUpperCase())) b.classList.add('has');
    if (n === selSlot) b.classList.add('sel');
    if (found.includes(n)) b.classList.add('found');
    b.addEventListener('click', () => tapTile(n));
    tilesEl.appendChild(b);
  });
}
const tileAt = n => tilesEl.children[n];

async function tapTile(n){
  if (busy) return;
  if (building){
    selSlot = (selSlot === n) ? null : n;
    drawTiles();
    wHint.textContent = selSlot === null ? 'Tap a card, then pick a letter' : 'Now pick a letter below';
    return;
  }
  if (target !== null){
    if (n === target){
      found.push(n);
      target = null;
      tileAt(n).classList.add('found');
      playRandomEffect();
      await playSound(letters[n]);
      if (found.length === letters.length){
        promptEl.textContent = 'You found them all!';
        setTimeout(blend, 500);
      } else {
        setTimeout(nextTarget, 700);
      }
    } else {
      const t = tileAt(n);
      t.classList.remove('nope'); void t.offsetWidth; t.classList.add('nope');
      await playSound(letters[n]);   // let her hear what that one actually says
      setTimeout(() => playSound(letters[target]), 450);
    }
    return;
  }
  const played = await playSound(letters[n]);
  if (!played && soundOn){
    wHint.textContent = `No recording for \u201c${letters[n]}\u201d yet \u2014 record it on the Letters card`;
  }
}

async function nextTarget(){
  const open = letters.map((_, n) => n).filter(n => !found.includes(n));
  if (!open.length) return;
  target = open[Math.floor(Math.random()*open.length)];
  promptEl.textContent = 'Which letter makes this sound?';
  await playSound(letters[target]);
}

function startAsk(){
  if (busy) return;
  exitBuild();
  found = [];
  drawTiles();
  nextTarget();
}

async function blend(){
  if (busy) return;
  busy = true;
  exitBuild();
  target = null;
  promptEl.textContent = 'Blend it together';
  // slow pass, then a quick one so the sounds run together into the word
  for (const gap of [220, 40]){
    for (let n = 0; n < letters.length; n++){
      const t = tileAt(n);
      t.classList.add('lit');
      await playSound(letters[n]);
      await new Promise(r => setTimeout(r, gap));
      t.classList.remove('lit');
    }
    await new Promise(r => setTimeout(r, 420));
  }
  [...tilesEl.children].forEach(t => t.classList.add('lit'));
  rainbowSweep();
  promptEl.textContent = letters.join('');
  await new Promise(r => setTimeout(r, 900));
  [...tilesEl.children].forEach(t => t.classList.remove('lit'));
  busy = false;
}

function setWord(str){
  letters = str.split('');
  found = []; target = null; selSlot = null;
  drawTiles();
  promptEl.textContent = 'Tap a letter to hear her sound';
}
function moveWord(step){
  if (busy) return;
  exitBuild();
  w = (w + step + words.length) % words.length;
  setWord(words[w]);
  playRandomEffect();
}

/* build / substitute */
function exitBuild(){
  building = false; selSlot = null;
  builder.hidden = true;
  buildBtn.textContent = 'Change letters';
  drawTiles();
}
function toggleBuild(){
  building = !building;
  builder.hidden = !building;
  buildBtn.textContent = building ? 'Done' : 'Change letters';
  found = []; target = null; selSlot = building ? 0 : null;
  drawTiles();
  wHint.textContent = building ? 'Tap a card, then pick a letter' : 'Arrows change the word';
}
'abcdefghijklmnopqrstuvwxyz'.split('').forEach(ch => {
  const b = document.createElement('button');
  b.textContent = ch;
  b.addEventListener('click', () => {
    if (selSlot === null) { wHint.textContent = 'Tap a card first'; return; }
    letters[selSlot] = ch;
    drawTiles();
    wHint.textContent = 'Tap the card to hear it';
  });
  alphaEl.appendChild(b);
});
document.getElementById('plusBtn').addEventListener('click', () => {
  if (letters.length >= 4) return;
  letters.push('t'); selSlot = letters.length - 1; drawTiles();
});
document.getElementById('minusBtn').addEventListener('click', () => {
  if (letters.length <= 2) return;
  letters.pop(); selSlot = Math.min(selSlot ?? 0, letters.length - 1); drawTiles();
});
document.getElementById('keepBtn').addEventListener('click', async () => {
  const str = letters.join('');
  if (!words.includes(str)){ words.push(str); w = words.length - 1; await saveWords(); }
  else w = words.indexOf(str);
  wHint.textContent = `Saved \u2014 ${words.length} words`;
  playRandomEffect();
});

blendBtn.addEventListener('click', blend);
askBtn.addEventListener('click', startAsk);
buildBtn.addEventListener('click', toggleBuild);
document.getElementById('wPrev').addEventListener('click', () => moveWord(-1));
document.getElementById('wNext').addEventListener('click', () => moveWord(1));

drawTiles();
loadWords();
refreshRecorded();

render();
refreshControls();
</script>
</body>
